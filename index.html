<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fed25d-js-inl-2-budget-app-mohammed-fe2025</title>
  </head>
  <body>
    <section id="main">
      <h1>Budget App</h1>
      <h2>Your Balance</h2>
      <h3 id="balanceDisplay">$0</h3>
      <section class="incomeExpenseSection">
        <div id="incomeSection">
          <input
            type="text"
            id="incomeInput"
            placeholder="Enter income amount"
          />
          <button type="button" id="setIncomeBtn">Set Income</button>
          <h2 id="incomeDisplay">Income: $0</h2>
        </div>
        <div id="expenseSection">
          <input
            type="text"
            id="expenseInput"
            placeholder="Enter expense amount"
          />
          <button type="button" id="addExpenseBtn">Add Expense</button>

          <h2 id="expenseDisplay">Expenses: $0</h2>
        </div>
      </section>
      <h3>Add Transaction</h3>
      <form>
        <input
          type="text"
          id="transactionDescreption"
          placeholder="transaction description"
        />
        <br />
        <br />
        <label class="amount" for="amount">
          Amount: (negative = expense, positive = income)
          <input
            type="text"
            id="transactionAmount"
            placeholder="Enter Amount"
          />
        </label>

        <br />
        <br />
        <button type="submit" id="addTransactionBtn">Add Transaction</button>
      </form>
      <!--transaction history-->
      <h2>Transaction History</h2>
      <ul id="transactionHistory"></ul>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
